
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meesho Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1 class="logo">meesho</h1>
    <input type="text" id="search"
      placeholder="Try Saree, Kurti, Shoes...">
    <button onclick="searchProducts()">Search</button>
    <span>👤 Profile</span>
    <span>🛒 Cart (<b id="count">0</b>)</span>
  </header>

  <nav>
    <a href="#">Women</a>
    <a href="#">Men</a>
    <a href="#">Kids</a>
    <a href="#">Footwear</a>
    <a href="#">Beauty</a>
    <a href="#">Home & Kitchen</a>
  </nav>

  <section class="hero">
    <h2>Shopping Made Easy!</h2>
    <p>Discover fashion and everyday essentials</p>
    <button onclick="showAll()">Shop Now</button>
  </section>

  <h2 class="heading">Products For You</h2>

  <main class="products" id="products">

    <div class="card" data-name="shoes">
      <img src="https://placehold.co/300x250?text=Shoes" alt="Shoes">
      <h3>Stylish Shoes</h3>
      <p>₹499</p>
      <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="card" data-name="kurti">
      <img src="https://placehold.co/300x250?text=Kurti" alt="Kurti">
      <h3>Beautiful Kurti</h3>
      <p>₹399</p>
      <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="card" data-name="watch">
      <img src="https://placehold.co/300x250?text=Watch" alt="Watch">
      <h3>Stylish Watch</h3>
      <p>₹299</p>
      <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="card" data-name="bag">
      <img src="https://placehold.co/300x250?text=Bag" alt="Bag">
      <h3>Fashion Bag</h3>
      <p>₹599</p>
      <button onclick="addToCart()">Add to Cart</button>
    </div>

  </main>

  <footer>
    <p>My Meesho Clone | Made for Learning</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
